[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntfslink"
version = "2.0.0"
description = "NTFS junction/symlink/hard link manipulation for Windows"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
typecheck = ["mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntfslink = ["py.typed", "*.pyi"]

[tool.mypy]
# The package supports Python >=3.8 at runtime (see requires-python above);
# every annotation is deferred via `from __future__ import annotations`, so
# checking against a newer stdlib here doesn't hide 3.8-incompatible code.
python_version = "3.10"
packages = ["ntfslink"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["ntfslink"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 100
