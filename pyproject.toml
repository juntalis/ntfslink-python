[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ntfslink-py"
version = "2.0.1"
description = "NTFS junction/symlink/hard link manipulation for Windows"
readme = "README.md"
requires-python = ">=3.8"
license = "WTFPL"
license-files = ["LICENSE"]
authors = [
    { name = "Charles Grunwald", email = "ch@rles.rocks" },
]
keywords = ["ntfs", "windows", "junction", "symlink", "hardlink", "reparse point"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/juntalis/ntfslink-python"
Repository = "https://github.com/juntalis/ntfslink-python"
Issues = "https://github.com/juntalis/ntfslink-python/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
typecheck = ["mypy"]
docs = ["sphinx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntfslink = ["py.typed", "*.pyi"]

[tool.mypy]
# The package supports Python >=3.8 at runtime (see requires-python above);
# every annotation is deferred via `from __future__ import annotations`, so
# checking against a newer stdlib here doesn't hide 3.8-incompatible code.
python_version = "3.10"
packages = ["ntfslink"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["ntfslink"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
